<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contribuyentes - SIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="bi bi-building"></i> SIN Tributario</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" href="/contribuyentes">Contribuyentes</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4 fw-bold text-secondary"><i class="bi bi-people"></i> Gestión de Contribuyentes</h2>
        
        <div class="row">
            <!-- Formulario -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold">Registrar Nuevo</div>
                    <div class="card-body">
                        <form id="formContribuyente">
                            <div class="mb-3">
                                <label class="form-label">Nombre o Razón Social</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Ej. Juan Pérez" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">RUC</label>
                                <input type="text" id="ruc" class="form-control" placeholder="Ej. 12345678-9" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com">
                            </div>
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save"></i> Guardar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>RUC</th>
                                        <th>Email</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaContribuyentes">
                                    <!-- Los datos se cargan aquí -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/contribuyentes';

        async function cargarContribuyentes() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const tbody = document.getElementById('tablaContribuyentes');
            tbody.innerHTML = '';
            data.forEach(c => {
                tbody.innerHTML += `
                    <tr>
                        <td><span class="badge bg-secondary">${c.id}</span></td>
                        <td class="fw-bold">${c.nombre}</td>
                        <td>${c.ruc}</td>
                        <td>${c.email || '<span class="text-muted">-</span>'}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-danger" onclick="eliminar(${c.id})">
                                <i class="bi bi-trash"></i> Eliminar
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById('formContribuyente').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const ruc = document.getElementById('ruc').value;
            const email = document.getElementById('email').value;

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, ruc, email })
            });

            if (res.ok) {
                e.target.reset();
                cargarContribuyentes();
            } else {
                const err = await res.json();
                alert('Error: ' + err.error);
            }
        });

        async function eliminar(id) {
            if (confirm('¿Está seguro de eliminar este contribuyente?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                cargarContribuyentes();
            }
        }

        cargarContribuyentes();
    </script>
</body>
</html>
