<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contribuyentes - SIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand" href="index.html">SIN Tributario</a>
        <div class="d-flex align-items-center gap-2">
            <input type="text" id="ipInput" class="form-control form-control-sm" style="width: 150px;" placeholder="IP de Ubuntu">
            <button class="btn btn-sm btn-warning" onclick="guardarIP()">Guardar IP</button>
        </div>
    </nav>
    <div class="container mt-4">
        <h2 class="mb-4">Gestión de Contribuyentes</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="formContribuyente">
                            <input type="text" id="nombre" class="form-control mb-2" placeholder="Nombre" required>
                            <input type="text" id="ruc" class="form-control mb-2" placeholder="RUC" required>
                            <input type="email" id="email" class="form-control mb-2" placeholder="Email">
                            <select id="perfil" class="form-select mb-2">
                                <option value="Independiente">Independiente</option>
                                <option value="Dependiente">Dependiente</option>
                            </select>
                            <button type="submit" class="btn btn-primary w-100">Registrar</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark"><tr><th>ID</th><th>Nombre</th><th>RUC</th><th>Perfil</th></tr></thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        let currentIP = localStorage.getItem('serverIP') || '192.168.6.225';
        document.getElementById('ipInput').value = currentIP;
        function getApiUrl() { return `http://${currentIP}:3000/api/contribuyentes`; }
        function guardarIP() { currentIP = document.getElementById('ipInput').value; localStorage.setItem('serverIP', currentIP); alert('IP actualizada'); cargar(); }
        async function cargar() {
            try {
                const res = await fetch(getApiUrl());
                const data = await res.json();
                const tbody = document.getElementById('tabla');
                tbody.innerHTML = '';
                data.forEach(c => tbody.innerHTML += `<tr><td>${c.id}</td><td>${c.nombre}</td><td>${c.ruc}</td><td>${c.perfil || 'N/A'}</td></tr>`);
            } catch (error) { console.error(error); }
        }
        document.getElementById('formContribuyente').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch(getApiUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre: document.getElementById('nombre').value, ruc: document.getElementById('ruc').value, email: document.getElementById('email').value, perfil: document.getElementById('perfil').value }) });
            e.target.reset(); cargar();
        });
        cargar();
    </script>
</body>
</html>
