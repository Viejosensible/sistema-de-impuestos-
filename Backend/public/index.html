<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Finanzas - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <script>
        // 🔒 BLOQUEO DE SEGURIDAD
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';
        const user = JSON.parse(localStorage.getItem('usuario') || '{}');
    </script>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="brand"><i class="bi bi-wallet2"></i> Mis Finanzas BO</div>
                <div class="text-center text-white mb-3 small">
                    <i class="bi bi-person-circle"></i> <span id="lblUser"></span><br>
                    <span class="badge bg-info text-dark" id="lblTipo"></span>
                </div>
                <a href="/" class="active"><i class="bi bi-pie-chart"></i> Mi Resumen</a>
                <a href="/gastos.html"><i class="bi bi-cart-dash"></i> Gastos Diarios</a>
                <a href="/declaraciones.html"><i class="bi bi-file-earmark-text"></i> Impuestos (SIN)</a>
                <a href="/reportes.html"><i class="bi bi-graph-up-arrow"></i> Reportes y Totales</a>
                <a href="#" onclick="localStorage.clear(); window.location.href='/login.html'" class="text-danger mt-5"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
            </nav>

            <main class="col-md-10 ms-sm-auto main-content">
                <h2 class="fw-bold mb-4">Mi Resumen Financiero</h2>
                
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body">
                                <h5 class="fw-bold mb-4 text-center">¿En qué se va mi dinero?</h5>
                                <canvas id="graficoGastos"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <div class="card shadow-sm border-0 bg-gradient-blue text-white h-100">
                            <div class="card-body p-4 d-flex flex-column justify-content-center">
                                <h3 class="fw-bold mb-3" id="saludo">¡Hola!</h3>
                                <p class="fs-5">Lleva el control de tus gastos e impuestos de forma fácil y segura.</p>
                                <div class="mt-4">
                                    <a href="/gastos.html" class="btn btn-light text-primary fw-bold me-2"><i class="bi bi-plus-lg"></i> Registrar Gasto</a>
                                    <a href="/declaraciones.html" class="btn btn-outline-light"><i class="bi bi-calculator"></i> Calcular Impuesto</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.getElementById('lblUser').innerText = user.nombre || 'Usuario';
        document.getElementById('lblTipo').innerText = user.tipo === 'negocio' ? 'Negocio' : 'Personal';
        document.getElementById('saludo').innerText = `¡Hola, ${user.nombre || 'Usuario'}!`;

        async function cargarGrafica() {
            const res = await fetch('/api/gastos/grafica', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.length === 0) return;

            const labels = data.map(item => item.categoria);
            const valores = data.map(item => item.total);

            new Chart(document.getElementById('graficoGastos').getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{ data: valores, backgroundColor: ['#ef4444', '#3b82f6', '#f59e0b', '#10b981', '#8b5cf6'] }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
        }
        cargarGrafica();
    </script>
</body>
</html>
