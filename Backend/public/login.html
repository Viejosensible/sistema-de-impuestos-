<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Impuestos BO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { width: 100%; max-width: 400px; border-radius: 15px; border: none; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-body p-4">
            <h3 class="text-center fw-bold mb-4">Impuestos Bolivia</h3>
            
            <!-- Pestañas -->
            <ul class="nav nav-tabs mb-3" id="myTab">
                <li class="nav-item"><a class="nav-link active" id="login-tab" data-bs-toggle="tab" href="#login">Iniciar Sesión</a></li>
                <li class="nav-item"><a class="nav-link" id="register-tab" data-bs-toggle="tab" href="#register">Registrarse</a></li>
            </ul>

            <div class="tab-content">
                <!-- Login -->
                <div class="tab-pane fade show active" id="login">
                    <form id="formLogin">
                        <div class="mb-3">
                            <label>Correo Electrónico</label>
                            <input type="email" id="loginEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Contraseña</label>
                            <input type="password" id="loginPassword" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                </div>

                <!-- Registro -->
                <div class="tab-pane fade" id="register">
                    <form id="formRegister">
                        <div class="mb-3">
                            <label>Nombre Completo</label>
                            <input type="text" id="regNombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Correo Electrónico</label>
                            <input type="email" id="regEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Contraseña</label>
                            <input type="password" id="regPassword" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Tipo de Cuenta (Bolivia)</label>
                            <select id="regTipo" class="form-select">
                                <option value="personal">Persona Natural (Sueldo)</option>
                                <option value="negocio">Negocio / Empresa</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Crear Cuenta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('loginEmail').value,
                    password: document.getElementById('loginPassword').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('usuario', JSON.stringify(data.usuario));
                window.location.href = '/'; // Ir al inicio
            } else {
                alert('Error: ' + data.error);
            }
        });

        document.getElementById('formRegister').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombre: document.getElementById('regNombre').value,
                    email: document.getElementById('regEmail').value,
                    password: document.getElementById('regPassword').value,
                    tipo_cuenta: document.getElementById('regTipo').value
                })
            });
            if (res.ok) {
                alert('✅ Cuenta creada. Ahora inicia sesión.');
                document.getElementById('login-tab').click();
            } else {
                const data = await res.json();
                alert('Error: ' + data.error);
            }
        });
    </script>
</body>
</html>
