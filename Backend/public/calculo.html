<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cálculo de Impuestos - SIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="bi bi-building"></i> SIN Tributario</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Volver al Panel</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="bi bi-calculator"></i> Calculadora Tributaria</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="formCalculo">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Monto Base (Bs.)</label>
                                <input type="number" step="0.01" id="montoBase" class="form-control form-control-lg" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Tasa de Impuesto (%)</label>
                                <select id="tasa" class="form-select">
                                    <option value="0.13">IVA (13%)</option>
                                    <option value="0.16">Otra Tasa (16%)</option>
                                    <option value="0.03">IT (3%)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fs-5"><i class="bi bi-cpu"></i> Calcular</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mt-4 mt-md-0">
                <div class="card shadow-sm border-0 rounded-3 bg-white h-100">
                    <div class="card-body p-4 d-flex flex-column justify-content-center text-center">
                        <div id="resultadoBox" class="d-none">
                            <p class="mb-1 text-muted">Impuesto a pagar:</p>
                            <h1 class="display-4 text-danger fw-bold" id="lblImpuesto">Bs. 0.00</h1>
                            <hr>
                            <p class="mb-1 text-muted">Total a pagar:</p>
                            <h3 class="text-success fw-bold" id="lblTotal">Bs. 0.00</h3>
                            <button class="btn btn-success mt-4 w-100 py-2" onclick="guardarDeclaracion()"><i class="bi bi-save"></i> Guardar Declaración</button>
                        </div>
                        <div id="vacioBox">
                            <i class="bi bi-receipt text-muted" style="font-size: 5rem;"></i>
                            <p class="mt-3 text-muted">Ingrese un monto y presione "Calcular"</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let calculoActual = { monto: 0, tasa: 0, impuesto: 0, total: 0 };

        document.getElementById('formCalculo').addEventListener('submit', (e) => {
            e.preventDefault();
            const monto = parseFloat(document.getElementById('montoBase').value);
            const tasa = parseFloat(document.getElementById('tasa').value);
            const impuesto = monto * tasa;
            const total = monto + impuesto;

            calculoActual = { monto_base: monto, tasa: tasa, impuesto: impuesto, total: total };

            document.getElementById('lblImpuesto').innerText = `Bs. ${impuesto.toFixed(2)}`;
            document.getElementById('lblTotal').innerText = `Bs. ${total.toFixed(2)}`;
            document.getElementById('vacioBox').classList.add('d-none');
            document.getElementById('resultadoBox').classList.remove('d-none');
        });

        async function guardarDeclaracion() {
            try {
                const res = await fetch('/api/declaraciones', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(calculoActual)
                });
                if (res.ok) {
                    alert('✅ Declaración guardada en la base de datos correctamente.');
                    window.location.href = '/reportes.html'; // Redirigir a reportes
                } else {
                    alert('❌ Error al guardar la declaración.');
                }
            } catch (error) {
                console.error(error);
                alert('Error de conexión.');
            }
        }
    </script>
</body>
</html>
