<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gastos - Mis Finanzas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        // Si no hay token, lo saca al login inmediatamente
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';
    </script>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="brand"><i class="bi bi-wallet2"></i> Mis Finanzas BO</div>
                <a href="/"><i class="bi bi-pie-chart"></i> Mi Resumen</a>
                <a href="/gastos.html" class="active"><i class="bi bi-cart-dash"></i> Gastos Diarios</a>
                <a href="/declaraciones.html"><i class="bi bi-file-earmark-text"></i> Impuestos</a>
                <a href="/reportes.html"><i class="bi bi-graph-up-arrow"></i> Reportes y Totales</a>
                <a href="#" onclick="localStorage.clear(); window.location.href='/login.html'" class="text-danger mt-5"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
            </nav>
            <main class="col-md-10 ms-sm-auto main-content">
                <h2 class="fw-bold mb-4">Mis Gastos Diarios</h2>
                <div class="row">
                    <div class="col-md-4">
                        <div class="card shadow-sm border-0 mb-4">
                            <div class="card-header bg-dark text-white">Anotar Gasto</div>
                            <div class="card-body">
                                <form id="formGasto">
                                    <div class="mb-3">
                                        <input type="text" id="descripcion" class="form-control" placeholder="¿En qué gastaste?" required>
                                    </div>
                                    <div class="mb-3">
                                        <input type="number" step="0.01" id="monto" class="form-control" placeholder="Monto (Bs.)" required>
                                    </div>
                                    <div class="mb-3">
                                        <select id="categoria" class="form-select">
                                            <option value="Alimentos">Alimentos</option>
                                            <option value="Transporte">Transporte</option>
                                            <option value="Servicios">Servicios</option>
                                            <option value="Entretenimiento">Entretenimiento</option>
                                            <option value="Otros">Otros</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <input type="date" id="fecha" class="form-control" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-circle"></i> Guardar</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <table class="table table-hover mt-2">
                                    <thead class="table-light"><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Monto</th></tr></thead>
                                    <tbody id="tablaGastos"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.getElementById('fecha').valueAsDate = new Date();

        // 1. CARGAR HISTORIAL (Usa el token para traer solo tus gastos)
        async function cargarGastos() {
            try {
                const res = await fetch('/api/gastos', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error("Error al cargar");
                
                const data = await res.json();
                const tbody = document.getElementById('tablaGastos');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No tienes gastos registrados aún.</td></tr>';
                    return;
                }

                data.forEach(g => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${g.fecha.split('T')[0]}</td>
                            <td class="fw-bold">${g.descripcion}</td>
                            <td><span class="badge bg-secondary">${g.categoria}</span></td>
                            <td class="text-danger fw-bold">Bs. ${g.monto}</td>
                        </tr>`;
                });
            } catch (error) {
                console.error(error);
            }
        }

        // 2. GUARDAR GASTO
        document.getElementById('formGasto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/gastos', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify({
                    descripcion: document.getElementById('descripcion').value,
                    monto: document.getElementById('monto').value,
                    categoria: document.getElementById('categoria').value,
                    fecha: document.getElementById('fecha').value
                })
            });
            
            if (res.ok) {
                e.target.reset();
                document.getElementById('fecha').valueAsDate = new Date();
                cargarGastos(); // Recarga la tabla con el nuevo gasto
            } else {
                alert("Error al guardar");
            }
        });

        cargarGastos();
    </script>
</body>
</html>
