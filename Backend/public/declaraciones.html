<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Impuestos - Bolivia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login.html';
        const user = JSON.parse(localStorage.getItem('usuario') || '{}');
    </script>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="brand"><i class="bi bi-wallet2"></i> Mis Finanzas BO</div>
                <a href="/"><i class="bi bi-pie-chart"></i> Mi Resumen</a>
                <a href="/gastos.html"><i class="bi bi-cart-dash"></i> Gastos Diarios</a>
                <a href="/declaraciones.html" class="active"><i class="bi bi-file-earmark-text"></i> Impuestos</a>
                <a href="/reportes.html"><i class="bi bi-graph-up-arrow"></i> Reportes y Totales</a>
                <a href="#" onclick="localStorage.clear(); window.location.href='/login.html'" class="text-danger mt-5"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
            </nav>
            <main class="col-md-10 ms-sm-auto main-content">
                <h2 class="fw-bold mb-4">Registro de Impuestos</h2>
                <div class="row">
                    <div class="col-md-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <form id="formDeclaracion">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Contribuyente</label>
                                        <input type="text" id="nombreUsuario" class="form-control" disabled readonly>
                                        <small class="text-muted">El impuesto se guardará a tu nombre.</small>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-bold">Periodo</label>
                                            <input type="month" id="periodo" class="form-control" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label fw-bold">Tipo</label>
                                            <select id="tipoImpuesto" class="form-select">
                                                <option value="IVA,0.13">IVA (13%)</option>
                                                <option value="IT,0.03">IT (3%)</option>
                                                <option value="IUE,0.25">IUE (25%)</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Monto Base (Bs.)</label>
                                        <input type="number" step="0.01" id="montoBase" class="form-control" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-calculator"></i> Calcular</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 mt-4 mt-md-0">
                        <div class="card shadow-sm border-0 h-100 bg-white" id="resultadoCard" style="display:none;">
                            <div class="card-body text-center d-flex flex-column justify-content-center">
                                <h5 class="text-muted">Resultado</h5>
                                <h1 class="text-danger fw-bold mt-3" id="lblImpuesto">Bs. 0.00</h1>
                                <p class="text-muted" id="lblDetalle"></p>
                                <hr>
                                <h3 class="text-success fw-bold" id="lblTotal">Bs. 0.00</h3>
                                <button class="btn btn-success mt-3" onclick="guardarDeclaracion()"><i class="bi bi-save"></i> Guardar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script>
        document.getElementById('nombreUsuario').value = user.nombre || 'Usuario';
        let calculoActual = {};
        
        document.getElementById('formDeclaracion').addEventListener('submit', (e) => {
            e.preventDefault();
            const periodo = document.getElementById('periodo').value;
            const monto = parseFloat(document.getElementById('montoBase').value);
            const valImpuesto = document.getElementById('tipoImpuesto').value.split(',');
            const tipo_impuesto = valImpuesto[0];
            const tasa = parseFloat(valImpuesto[1]);
            
            const impuesto = monto * tasa;
            const total = monto + impuesto;
            
            calculoActual = { periodo, tipo_impuesto, monto_base: monto, tasa, impuesto, total };
            
            document.getElementById('lblDetalle').innerText = `Impuesto ${tipo_impuesto} (${tasa*100}%)`;
            document.getElementById('lblImpuesto').innerText = `Bs. ${impuesto.toFixed(2)}`;
            document.getElementById('lblTotal').innerText = `Total: Bs. ${total.toFixed(2)}`;
            document.getElementById('resultadoCard').style.display = 'block';
        });

        async function guardarDeclaracion() {
            try {
                const res = await fetch('/api/declaraciones', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(calculoActual)
                });
                if (res.ok) { 
                    alert('✅ Impuesto guardado exitosamente.'); 
                    window.location.href = '/reportes.html'; // Te lleva directo a reportes
                } else { 
                    alert('❌ Error al guardar.'); 
                }
            } catch (error) {
                console.error(error);
                alert('Error de conexión.');
            }
        }
    </script>
</body>
</html>
